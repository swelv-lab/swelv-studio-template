<!doctype html>
<!-- ---------------------------------------------------------------------------
  the logo metamorphosis · story (1920x1080 @ 30fps, 9.4s, then the 6.5s ender)

  ONE lockup. It never moves, is never replaced, and is never cross-faded. It
  is a single SVG — a hand-drawn "swel" plus the V — and the film changes its
  MATERIAL by interpolating state: colours, stroke weights, glow, the V's own
  Bezier coordinates. Everything downstream reads those values, so the letters
  genuinely become something else rather than one picture dissolving into the
  next.

  Three worlds, and the joins between them are PHYSICAL:

    hand → neon   the sunset rises up over the paper; the lockup turns over like
                  a card and comes back as chrome, the V morphing the whole way
    neon → press  the machine is switched off — the screen collapses to a bright
                  line, then a dot, the way a CRT does. Then the press runs: the
                  blue plate drops and lands, the orange drops and lands a beat
                  later, slightly off; the halftone prints in from the foot
    press → end   the sheet is pulled off the press and the ground drains to
                  navy. The ender opens on that navy and its mark lands on the
                  water — one film, not two.

  SEQUENCING IS GSAP. A PAUSED timeline is seekable and pure: tl.seek(t) renders
  the exact state at t with no clock involved, so window.seek stays a pure
  function of time and every frame is reproducible. This is the only kind of
  animation library the pipeline can use — anything wall-clock driven (CSS
  transitions, Framer Motion, a ticker) would break that rule. The library is
  vendored at ../../posts/vendor/gsap.min.js; the render never touches the
  network.

  Two rules that come with it, both learned by breaking them:
    · never write style.transform on an element GSAP is transforming — it stamps
      over GSAP's value every frame. Route everything through gsap.set.
    · tl.seek(t, true) suppresses callbacks, so an onUpdate never fires under
      seek. Heavy reveals tween a NUMBER on a plain object; apply() reads it.

  Render: ./render.sh   Sound: metamorphosis.audio.json, laid by render-audio.js
---------------------------------------------------------------------------- -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:"Caveat";          src:url("fonts/caveat-500.woff2") format("woff2");        font-weight:500; font-display:block }
  @font-face { font-family:"Share Tech Mono"; src:url("fonts/sharetechmono-400.woff2") format("woff2"); font-weight:400; font-display:block }
  @font-face { font-family:"Audiowide";       src:url("fonts/audiowide-400.woff2") format("woff2");     font-weight:400; font-display:block }
  @font-face { font-family:"Satoshi";         src:url("fonts/Satoshi-Bold.otf") format("opentype");     font-weight:700; font-display:block }

  * { margin:0; padding:0; box-sizing:border-box }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#0a0e27 }
  .stage {
    position:relative; width:1920px; height:1080px; overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
    /* every one of these is rewritten each frame by apply() */
    --bg:#f4efe4; --ink:#1b2430; --vink:#e2500a;
    --w:7.5; --vw:12.5; --sw:7.5; --swo:0.5;
    --grain:0.22; --sky:0; --grid:0; --scan:0; --bloom:0;
    --wordop:0; --handop:1; --face:"Audiowide"; --fw:800; --fs:72px;
    --dots:0; --qp:0;
  }
  .scene { position:absolute; inset:0 }
  .layer { position:absolute; inset:0; pointer-events:none }

  /* ── the grounds — everything that enters and leaves ─────────────────── */
  #bg     { background:var(--bg) }
  #grain  { opacity:var(--grain); mix-blend-mode:multiply }
  #grain svg { position:absolute; inset:0; width:100%; height:100% }
  #vig    { opacity:var(--grain); background:radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,0) 40%, rgba(120,95,60,0.5) 100%) }
  #sky    { opacity:var(--sky); background:linear-gradient(180deg,#070a1c 0%,#14183a 30%,#4a2140 58%,#a03a18 84%,#ff6a12 100%); height:648px; bottom:auto }
  #sun    { position:absolute; left:50%; top:150px; width:540px; height:540px; margin-left:-270px; border-radius:50%; overflow:hidden;
            opacity:var(--sky); background:linear-gradient(180deg,#ffd76a 0%,#ff8a1e 46%,#ff3d5a 100%) }
  #sun i  { position:absolute; left:0; width:100%; background:#0b0d22 }
  #hz     { position:absolute; left:0; top:648px; width:100%; height:3px; opacity:var(--grid);
            background:#ff9a3c; box-shadow:0 0 26px 6px rgba(255,110,20,.75) }
  #floor  { position:absolute; left:0; top:651px; right:0; bottom:0; overflow:hidden; opacity:var(--grid); background:#0a0c20 }
  #floor svg { position:absolute; inset:0; width:100%; height:100% }
  #flash  { background:#fff; opacity:0; mix-blend-mode:screen }
  #scan   { opacity:var(--scan); background:repeating-linear-gradient(180deg, rgba(0,0,0,.34) 0 1px, rgba(0,0,0,0) 1px 4px) }
  #bloom  { position:absolute; left:50%; top:508px; width:1200px; height:560px; margin:-280px 0 0 -600px; border-radius:50%;
            opacity:var(--bloom); background:radial-gradient(closest-side, rgba(255,120,30,.32), rgba(255,61,90,.09) 55%, rgba(0,0,0,0) 78%) }
  /* PRESS · the halftone is real dots, one circle each, so the band can print
     in row by row and the dots can swell in a wave as the drum turns. A tiled
     background can only scroll, and scrolling is not a press running. */
  #dots   { top:auto; height:300px; opacity:var(--dots); mix-blend-mode:multiply }
  #dots svg { position:absolute; inset:0; width:100%; height:100% }
  /* the CRT switching off: everything collapses to this line, then to nothing */
  #crt    { position:absolute; left:0; right:0; top:50%; height:4px; margin-top:-2px; background:#fff;
            opacity:0; box-shadow:0 0 18px 6px rgba(255,220,180,.9) }

  /* ── the constant · exactly the ender's lockup box, never moves ────────── */
  #lockup { position:absolute; top:405px; left:50%; margin-left:-300px; width:600px }
  #lockup svg { display:block; overflow:visible; width:600px }
  #gHand { opacity:var(--handop) }
  #word  { fill:var(--ink); opacity:var(--wordop); font-family:var(--face); font-weight:var(--fw); font-size:var(--fs) }
  #vmk   { fill:none; stroke-linecap:round; stroke-linejoin:round }
  #vcrest{ stroke:var(--vink); stroke-width:var(--vw) }
  #vswell{ stroke:var(--vink); stroke-width:var(--sw); opacity:var(--swo) }

  /* ── content that enters and leaves around it ────────────────────────── */
  #qualHand { position:absolute; top:640px; left:0; right:0; text-align:center;
              font-family:"Caveat",cursive; font-weight:500; font-size:64px; color:#5b6373; transform:rotate(1.2deg) }
  #qualNeon { position:absolute; top:648px; left:0; right:0; text-align:center;
              font-family:"Share Tech Mono",monospace; font-size:26px; letter-spacing:.86em; text-indent:.86em;
              text-transform:uppercase; color:#ffe3b6; text-shadow:0 0 18px rgba(255,140,40,.95), 0 0 44px rgba(255,90,10,.6) }
  #qualPress { position:absolute; top:648px; left:0; right:0; text-align:center; opacity:var(--qp);
               font-family:"Share Tech Mono",monospace; font-size:26px; letter-spacing:.46em; text-indent:.46em;
               text-transform:uppercase; color:#2b3a8f; mix-blend-mode:multiply }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="scene" id="scene">

  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="paperF"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap id="wobMap" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop id="c0" offset="0%"   stop-color="#1b2430"/><stop id="c1" offset="34%" stop-color="#1b2430"/>
      <stop id="c2" offset="52%"  stop-color="#1b2430"/><stop id="c3" offset="72%" stop-color="#1b2430"/>
      <stop id="c4" offset="100%" stop-color="#1b2430"/>
    </linearGradient>
  </defs></svg>

  <div class="layer" id="bg"></div>
  <div class="layer" id="grain"><svg xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" filter="url(#paperF)"/></svg></div>
  <div class="layer" id="vig"></div>
  <div class="layer" id="sky"></div>
  <div id="sun"></div>
  <div id="hz"></div>
  <div id="floor"><svg id="floorSvg" viewBox="0 0 1920 429" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#ff6a12" stroke-width="2" opacity=".85">
      <line x1="960" y1="0" x2="-1800" y2="429"/><line x1="960" y1="0" x2="-1100" y2="429"/><line x1="960" y1="0" x2="-500" y2="429"/>
      <line x1="960" y1="0" x2="-70" y2="429"/><line x1="960" y1="0" x2="280" y2="429"/><line x1="960" y1="0" x2="560" y2="429"/>
      <line x1="960" y1="0" x2="790" y2="429"/><line x1="960" y1="0" x2="960" y2="429"/><line x1="960" y1="0" x2="1130" y2="429"/>
      <line x1="960" y1="0" x2="1360" y2="429"/><line x1="960" y1="0" x2="1640" y2="429"/><line x1="960" y1="0" x2="1990" y2="429"/>
      <line x1="960" y1="0" x2="2420" y2="429"/><line x1="960" y1="0" x2="3020" y2="429"/><line x1="960" y1="0" x2="3720" y2="429"/>
      <g id="hzg"></g>
    </g></svg></div>
  <div class="layer" id="scan"></div>
  <div class="layer" id="flash"></div>
  <div id="bloom"></div>
  <div class="layer" id="dots"></div>
  <div id="crt"></div>

  <div id="qualHand">studio</div>
  <div id="qualNeon">Studio</div>
  <div id="qualPress">swelv studio</div>

  <!-- THE CONSTANT -->
  <div id="lockup">
    <svg viewBox="-1.5 -80.4 250.73 86.4">
      <text id="word" x="2.5" y="0" textLength="182.8" lengthAdjust="spacingAndGlyphs">swel</text>
      <g id="gHand" transform="translate(31 -14) rotate(-2.2 92.9 -20)">
        <mask id="write" maskUnits="userSpaceOnUse" x="-40" y="-110" width="330" height="150">
          <g id="wm" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 26 -29 C 20 -34, 8 -32, 6 -24 C 4 -17, 16 -14, 20 -10 C 24 -6, 20 0, 12 1 C 8 1, 5 0, 3 -2"/>
            <path d="M 33 -31 C 35 -20, 38 -6, 42 0 C 46 -8, 49 -22, 52 -32 C 54 -21, 57 -6, 61 0 C 65 -8, 69 -22, 73 -32"/>
            <path d="M 79 -18 C 87 -19, 94 -20, 98 -21 C 99 -28, 93 -32, 86 -31 C 78 -30, 75 -22, 76 -13 C 77 -5, 85 -1, 93 -3 C 97 -4, 100 -7, 102 -10"/>
            <path d="M 114 -47 C 112 -34, 109 -18, 108 -6 C 107 -1, 110 1, 116 0"/>
          </g>
        </mask>
        <g filter="url(#wob)">
          <text id="hword" x="0" y="0" font-family="Caveat" font-weight="700" font-size="86"
                fill="var(--ink)" mask="url(#write)">swel</text>
          <path id="hunder" d="M 2 9 C 44 5, 92 13, 140 7" fill="none"
                stroke="var(--vink)" stroke-width="3.4" stroke-linecap="round"/>
        </g>
        <g id="hV" transform="translate(126 -38.4) scale(0.4810) translate(-18 -12)" filter="url(#wob)">
          <path id="hcrest" fill="none" stroke="var(--vink)" stroke-width="12.5" stroke-linecap="round"/>
          <path id="hswell" fill="none" stroke="var(--vink)" stroke-width="7.5" stroke-linecap="round" opacity="0.5"/>
        </g>
      </g>
      <g transform="translate(175.28 -61.39) scale(0.6957)" id="vmk">
        <path id="vcrest"/><path id="vswell"/>
      </g>
    </svg>
  </div>

</div></div>

<script src="../../posts/vendor/gsap.min.js"></script>
<script>
const DUR = 9.4;

/* ── the V, as two cubics per path, so it MORPHS rather than swaps ──────── */
const V = {
  handC:  [27,22, 37,44,   50,69,   61,86, 71,68,   82,44,   93,23],
  geoC:   [30,24, 40,43.33,50,62.67,60,82, 70,62.67,80,43.33,90,24],
  handS:  [47,19, 51,28,   56,38,   60,46, 64,38,   69,28,   73,20],
  geoS:   [45,22, 50,31,   55,40,   60,49, 65,40,   70,31,   75,22],
};
const dOf = a => `M ${a[0]} ${a[1]} C ${a[2]} ${a[3]}, ${a[4]} ${a[5]}, ${a[6]} ${a[7]} C ${a[8]} ${a[9]}, ${a[10]} ${a[11]}, ${a[12]} ${a[13]}`;

/* ── the state · one object GSAP tweens, and apply() renders ──────────────
   Colours are CSS strings — GSAP interpolates those natively. vm is the V's
   morph, 0 = the hand-drawn bowed V, 1 = the geometric one. lockY and blueY
   are the two press plates' positions in px, kept separate so they can drop
   and land on their own. */
const cur = {
  bg:"rgb(244,239,228)", ink:"rgb(27,36,48)", vink:"rgb(226,80,10)",
  w:7.5, vw:12.5, sw:7.5, swo:0.5, grain:0.22, sky:0, grid:0, scan:0, bloom:0,
  wordop:0, handop:1, vop:0, wob:2.2, sunY:0, chrome:0, vm:0,
  qh:1, qn:0, qp:0, dots:0, dotsIn:0, plate:0, face:"hand", lockY:0, blueY:0,
};
const FACE = { hand:['"Audiowide"',400,72], neon:['"Audiowide"',400,60], press:['"Satoshi"',700,74] };

const clamp01 = x => Math.max(0, Math.min(1, x));
const lin = (t,a,b) => clamp01((t-a)/(b-a));
const eio = x => x<0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;
const eoq = x => 1 - Math.pow(1-x,4);
const L = (a,b,p) => a + (b-a)*p;
const La = (a,b,p) => a.map((v,i)=>L(v,b[i],p));
const rgb = s => s.match(/[\d.]+/g).slice(0,3).map(Number);
const Lc = (a,b,p) => `rgb(${Math.round(L(a[0],b[0],p))},${Math.round(L(a[1],b[1],p))},${Math.round(L(a[2],b[2],p))})`;

const $ = id => document.getElementById(id);
const stage=$("stage"), scene=$("scene"), sun=$("sun"), wobMap=$("wobMap");
const vcrest=$("vcrest"), vswell=$("vswell"), qh=$("qualHand"), qn=$("qualNeon");
const hcrest=$("hcrest"), hswell=$("hswell"), hunder=$("hunder");
const word=$("word"), lockEl=$("lockup"), chromeGrad=$("chrome"), floorG=$("hzg"), flash=$("flash");
const NHZ = 11;
const hzLines = Array.from({length: NHZ}, () => {
  const l = document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1",0); l.setAttribute("x2",1920); l.setAttribute("stroke","#ff6a12"); l.setAttribute("stroke-width",2);
  floorG.appendChild(l); return l;
});
const wmPaths=[...$("wm").querySelectorAll("path")];
(function(){ let y=540*0.42; for(let i=0;i<14;i++){ const h=(3+i*1.7)*(540/470);
  const e=document.createElement("i"); e.style.top=y+"px"; e.style.height=h+"px"; sun.appendChild(e);
  y += h + Math.max(5,20-i*1.15)*(540/470); } })();
const CH = [$("c0"),$("c1"),$("c2"),$("c3"),$("c4")];
const CH_ON = [[255,246,226],[180,97,28],[255,255,255],[255,180,87],[168,58,8]];

/* the press's dots: a real grid of circles over the foot of the sheet */
const DOT = { cols: 192, rows: 30, pitch: 10, els: [] };
{ const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox", "0 0 1920 300");
  for (let r = 0; r < DOT.rows; r++) for (let c = 0; c < DOT.cols; c++) {
    const e = document.createElementNS("http://www.w3.org/2000/svg","circle");
    e.setAttribute("cx", c * DOT.pitch + 5); e.setAttribute("cy", r * DOT.pitch + 5);
    e.setAttribute("fill", "#2b3a8f"); e.setAttribute("r", 0);
    svg.appendChild(e); DOT.els.push(e);
  }
  $("dots").appendChild(svg); }

/* ── apply: the state → the DOM ─────────────────────────────────────────── */
function apply(s){
  const st = stage.style;
  st.setProperty("--bg", s.bg); st.setProperty("--ink", s.ink); st.setProperty("--vink", s.vink);
  ["w","vw","sw","swo","grain","sky","grid","scan","bloom","wordop","handop","dots","qp"].forEach(k => st.setProperty("--"+k, s[k]));
  wobMap.setAttribute("scale", s.wob.toFixed(2));
  vcrest.setAttribute("d", dOf(La(V.handC, V.geoC, s.vm))); vswell.setAttribute("d", dOf(La(V.handS, V.geoS, s.vm)));
  $("vmk").style.opacity = s.vop;
  hcrest.setAttribute("d", dOf(V.handC)); hswell.setAttribute("d", dOf(V.handS));
  /* through GSAP, not style.transform: the CRT-off scales these same elements,
     and a direct style write here would stamp over that scale every frame */
  gsap.set(sun, { y: (1-s.sunY)*560 }); gsap.set($("floor"), { y: (1-s.sunY)*429 });
  qh.style.opacity = s.qh; qn.style.opacity = s.qn;
  const ink = rgb(s.ink);
  CH.forEach((el,i)=> el.setAttribute("stop-color", Lc(ink, CH_ON[i], s.chrome)));
  const f = FACE[s.face];
  st.setProperty("--face", f[0]); st.setProperty("--fw", f[1]); st.setProperty("--fs", f[2] + "px");
  word.style.fill = s.chrome > 0.02 ? "url(#chrome)" : s.ink;
  const g = s.bloom;
  /* the blue plate is the lockup's own hard offset copy. Its position is
     absolute (blueY) while the lockup's is lockY, so the two can drop and land
     separately; the offset the filter needs is just the difference. */
  const pdy = s.blueY - s.lockY + 6;
  const plate = s.plate > 0.01 ? `drop-shadow(-7px ${pdy.toFixed(1)}px 0 rgba(43,58,143,${(0.92*s.plate).toFixed(3)})) ` : "";
  const depth = g > 0.02
    ? `drop-shadow(0 0 ${3*g}px rgba(6,4,18,.98)) drop-shadow(0 0 ${14*g}px rgba(6,4,18,.85)) drop-shadow(0 0 ${26*g}px rgba(255,110,20,.6))` : "";
  lockEl.style.filter = plate + depth;
}

/* ── THE TIMELINE ─────────────────────────────────────────────────────────── */
const NEON = [$("sky"), $("sun"), $("hz"), $("floor"), $("scan"), $("bloom"), $("qualNeon")];
gsap.set(NEON, { transformOrigin: "50% 50%" });
gsap.set(lockEl, { transformPerspective: 1100, transformOrigin: "50% 50%" });
gsap.set($("sky"), { clipPath: "inset(100% 0 0 0)" });

const tl = gsap.timeline({ paused: true, defaults: { overwrite: false } });
const NEON_C  = { bg:"rgb(7,10,28)", ink:"rgb(255,214,138)", vink:"rgb(255,180,80)", w:12, vw:13, sw:9, swo:0.75, grain:0 };
const PRESS_C = { bg:"rgb(242,236,224)", ink:"rgb(232,72,10)", vink:"rgb(232,72,10)", w:12, vw:12.5, sw:10, swo:0.55, grain:0.30 };

/* 1 · HAND → NEON @2.95 — the sunset rises up over the paper; the lockup turns
   over like a card and comes back as chrome; the V morphs the whole way. */
tl.to(cur, { ...NEON_C, duration: 0.9, ease: "power2.inOut" }, 2.95)
  .set(cur, { sky: 1 }, 2.95)
  .to($("sky"), { clipPath: "inset(0% 0 0 0)", duration: 0.85, ease: "expo.out" }, 2.95)
  .to(cur, { sunY: 1, duration: 0.90, ease: "expo.out" }, 3.02)
  .to(cur, { grid: 1, duration: 0.45, ease: "power2.out" }, 3.15)
  .to(cur, { vm: 1, wob: 0, duration: 0.55, ease: "power2.inOut" }, 3.28)
  .to(lockEl, { rotationY: 92, duration: 0.24, ease: "power2.in" }, 3.30)
  .set(cur, { face: "neon", handop: 0, wordop: 1, vop: 1, qh: 0 }, 3.54)
  .set(lockEl, { rotationY: -92 }, 3.54)
  .to(lockEl, { rotationY: 0, duration: 0.34, ease: "back.out(1.7)" }, 3.54)
  .to(cur, { chrome: 1, duration: 0.45, ease: "power2.out" }, 3.54)
  .to(cur, { scan: 1, bloom: 1, qn: 1, duration: 0.40 }, 3.62)
  .fromTo(lockEl, { scale: 1.30 }, { scale: 1, duration: 0.52, ease: "expo.out" }, 3.86);

/* 2 · NEON → PRESS @5.85 — the machine is switched off: the screen collapses
   to a line, then a dot. The press runs: blue plate drops and lands, orange
   drops and lands a beat later, the halftone prints in from the foot. */
tl.to([...NEON, lockEl], { scaleY: 0.006, duration: 0.26, ease: "expo.in" }, 5.85)
  .to($("crt"), { opacity: 1, duration: 0.05 }, 6.06)
  .to([...NEON, lockEl], { scaleX: 0, duration: 0.14, ease: "power3.in" }, 6.11)
  .to($("crt"), { scaleX: 0, opacity: 0, duration: 0.16, ease: "power3.in" }, 6.12)
  .to(cur, { ...PRESS_C, duration: 0.20, ease: "power2.out" }, 6.24)
  .set(cur, { sky: 0, grid: 0, scan: 0, bloom: 0, chrome: 0, qn: 0, sunY: 0, face: "press" }, 6.28)
  .set(NEON, { scaleX: 1, scaleY: 1 }, 6.30)
  .set(lockEl, { scaleX: 1, scaleY: 1, rotationY: 0 }, 6.30)
  .set(cur, { lockY: -340, blueY: -340, plate: 1 }, 6.30)
  .to(cur, { blueY: 0, duration: 0.44, ease: "back.out(1.6)" }, 6.44)      /* plate one lands ~6.86 */
  .to(cur, { lockY: 0, duration: 0.44, ease: "back.out(1.6)" }, 6.58)      /* plate two lands ~7.00 */
  .set(cur, { dots: 1 }, 6.70)
  .to(cur, { dotsIn: 1, duration: 0.62, ease: "power2.out" }, 6.70)
  .to(cur, { qp: 1, duration: 0.22 }, 7.06);

/* 3 · PRESS → THE ENDER @8.30 — the sheet is pulled off the press, the ground
   drains to the ender's navy, and the ender's mark lands on the water. */
tl.to(cur, { blueY: -360, duration: 0.34, ease: "power3.in" }, 8.30)
  .to(cur, { lockY: -360, duration: 0.36, ease: "power3.in" }, 8.36)
  .to(cur, { qp: 0, duration: 0.18 }, 8.35)
  .to(cur, { dotsIn: 0, duration: 0.42, ease: "power2.in" }, 8.36)
  .to(cur, { bg: "rgb(10,14,39)", grain: 0, duration: 0.5, ease: "power2.inOut" }, 8.45)
  .set(cur, { plate: 0, wordop: 0, vop: 0, dots: 0 }, 8.74);
/* bare navy from ~8.95 to 9.4; the ender opens on the same navy */

/* ── post: the pure-function-of-t things that never needed a tween ─────────── */
const CUE = { write:[0.35,2.15], vDraw:[2.15,2.62], under:[2.55,2.88] };
function post(t){
  const wp = lin(t, CUE.write[0], CUE.write[1]);
  wmPaths.forEach((path,i)=>{
    const a=i/wmPaths.length, b=(i+1)/wmPaths.length, lp = eoq(clamp01((wp-a)/(b-a)));
    if (!path._L) path._L = path.getTotalLength();
    path.style.strokeDasharray = path._L; path.style.strokeDashoffset = path._L*(1-lp);
  });
  const vp = eoq(lin(t, CUE.vDraw[0], CUE.vDraw[1])), sp = eoq(lin(t, CUE.vDraw[0]+0.35, CUE.vDraw[1]+0.25));
  [[hcrest,vp],[hswell,sp]].forEach(([el,q])=>{ const l = el.getTotalLength(); el.style.strokeDasharray = l; el.style.strokeDashoffset = l*(1-q); });
  { const l = hunder.getTotalLength(), q = eio(lin(t, CUE.under[0], CUE.under[1]));
    hunder.style.strokeDasharray = l; hunder.style.strokeDashoffset = l*(1-q); }
  qh.style.clipPath = `inset(-25% ${(1-eio(lin(t,CUE.under[0],CUE.under[1]+0.3)))*100}% -25% -5%)`;

  /* the attract screen: the floor scrolls, the chrome runs, the scanlines roll */
  const ph = (t - 2.95) * 0.95;
  hzLines.forEach((l,i)=>{ const u = (((i + ph) % NHZ) + NHZ) % NHZ / NHZ, y = 429 * Math.pow(u, 2.4);
    l.setAttribute("y1", y); l.setAttribute("y2", y); l.setAttribute("opacity", (0.9 * Math.min(1, u * 5)).toFixed(3)); });
  flash.style.opacity = (0.30 * Math.pow(1 - clamp01(lin(t, 4.00, 4.20)), 3)).toFixed(3);
  chromeGrad.setAttribute("gradientTransform", `translate(0 ${(0.085 * Math.sin((t - 4.0) * 2.1)).toFixed(4)})`);
  $("scan").style.backgroundPosition = `0 ${((t*46)%4).toFixed(2)}px`;

  /* the press: the dots swell in a wave that travels across the sheet — a press
     running, not a tile scrolling — and the wave breathes with the plates' drift */
  { const dr = 1 + 0.30 * Math.sin(t * 2.3) + 0.10 * Math.sin(t * 5.1);
    const visRows = DOT.rows * cur.dotsIn;
    for (let r = 0; r < DOT.rows; r++) {
      const on = r >= DOT.rows - visRows, base = 4.4 * Math.pow((r + 1) / DOT.rows, 0.9);
      for (let c = 0; c < DOT.cols; c++) {
        const e = DOT.els[r * DOT.cols + c];
        if (!on || cur.dots < 0.01) { e.setAttribute("r", 0); continue; }
        e.setAttribute("r", (base * (0.70 + 0.30 * Math.sin(c * DOT.pitch * 0.017 - t * 7.2 + r * 0.42) * dr)).toFixed(2));
      }
    } }
  scene.style.opacity = 1 - eio(lin(t, 9.00, 9.35));
}

/* the contract with the renderer: seconds via window.seek, 0..1 via renderFrame,
   and the URL hash for the no-node fallback path */
window.seek = function(t){
  tl.seek(Math.max(0, Math.min(DUR, t)), true);
  gsap.set(lockEl, { y: cur.lockY });
  apply(cur);
  post(t);
};
window.renderFrame = u => window.seek(u * DUR);
function hashSeek(){ const h=parseFloat((location.hash||"").slice(1)); if(!Number.isNaN(h)) window.seek(h*DUR); }
addEventListener("hashchange", hashSeek);
window.seek(0); hashSeek();
</script>
