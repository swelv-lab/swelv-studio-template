<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Starter card</title>
    <link rel="stylesheet" href="../../brand-kit/brand.css" />
    <style>
      /* ---------------------------------------------------------------------
         LAYOUT ONLY. Never a colour, never a typeface — those live in the
         brand kit so that changing the brand is one edit, not two hundred.
         Copy this file to start a new post.
      --------------------------------------------------------------------- */
      .canvas {
        --w: 1080px;
        --h: 1350px;
      }
      .stage {
        justify-content: space-between;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .top .logo-lockup {
        font-size: 30px;
        --mark-size: 1.05em;
      }

      .body .kicker {
        margin-bottom: 26px;
      }
      .body .headline {
        font-size: 76px;
        max-width: 15ch;
      }
      .body .subhead {
        margin-top: 26px;
        font-size: 24px;
      }

      /* A small evidence panel. One number, stated once, at full ink. */
      .panel {
        margin-top: 54px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        padding: 34px 36px;
        display: flex;
        gap: 44px;
      }
      .stat .n {
        font-family: var(--sans);
        font-weight: 700;
        font-size: 58px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--fg);
      }
      .stat .n.mark {
        color: var(--accent);
      }
      .stat .l {
        margin-top: 12px;
        font-family: var(--mono);
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .div {
        width: 1px;
        background: var(--line-soft);
      }

      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .foot .annot {
        font-family: var(--sans);
        font-weight: 500;
        font-size: 19px;
        color: var(--muted);
        max-width: 40ch;
      }

      .panel.col { flex-direction: column; gap: 0; padding: 8px 36px; }
      .ev {
        display: flex; align-items: baseline; gap: 22px;
        padding: 22px 0; border-bottom: 1px solid var(--line-soft);
      }
      .ev:last-child { border-bottom: 0; }
      .ev .t { font-family: var(--mono); font-size: 17px; color: var(--faint); width: 5.5ch; }
      .ev .w { font-family: var(--sans); font-weight: 500; font-size: 24px; color: var(--fg); flex: 1; }
      .ev .who {
        font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
        text-transform: uppercase; color: var(--faint);
        border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
      }
      .ev.on .who { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="stage">
        <div class="top">
          <div class="logo-lockup"><span class="wordmark">Meridian</span></div>
          <span class="index">02 / 03</span>
        </div>

        <div class="body">
          <p class="kicker">Where the answer lives</p>
          <h1 class="headline">
            <span class="q">Three systems.</span>
            <span class="q">None of them agree.</span>
          </h1>
          <p class="subhead">The driver has it in his head, the dispatcher has it on a notepad, and the sheet was last touched this morning.</p>

        </div>

        <div class="foot">
          <p class="annot">Every call is someone rebuilding an answer that already existed somewhere else.</p>
          <span class="swipe">Swipe &rarr;</span>
        </div>
      </div>
    </div>
  </body>
</html>
