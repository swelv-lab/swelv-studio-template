<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none" aria-label="Meridian mark">
  <!-- Demo-brand mark: a meridian — a globe reduced to one circle and one arc.
       Uses currentColor so it inherits the ink colour wherever it is placed. -->
  <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="9" />
  <ellipse cx="50" cy="50" rx="17" ry="42" stroke="currentColor" stroke-width="9" />
</svg>
