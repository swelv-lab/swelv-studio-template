<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deck template · closing</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="../../../brand-kit/brand.css" />
    <link rel="stylesheet" href="deck.css" />
    <style>
      .closemotto {
        font-family: var(--sans);
        font-weight: 900;
        font-size: 96px;
        line-height: 1.06;
        letter-spacing: -0.04em;
        color: var(--fg);
        max-width: 20ch;
      }
      .closemotto .accent {
        color: var(--accent);
      }
      .ask {
        margin-top: 34px;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 30px;
        line-height: 1.4;
        color: var(--muted);
        max-width: 40ch;
      }
      .cta {
        margin-top: 52px;
        display: inline-flex;
        align-items: baseline;
        gap: 16px;
      }
      .cta .label {
        font-size: 28px;
        font-weight: 600;
        color: var(--muted);
      }
      .cta .url {
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--accent);
      }
      .cta .arrow {
        font-size: 38px;
        font-weight: 500;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="stage">
        <div class="shead">
          <div class="logo-lockup"><span class="wordmark">swel</span></div>
          <div class="smeta">
            <span class="section">Closing</span>
            <span class="page">07</span>
          </div>
        </div>

        <div class="sbody">
          <h2 class="closemotto">The line you want <span class="accent">them repeating.</span></h2>
          <p class="ask">
            The ask, stated plainly: what you are raising, what it buys, and what you
            want the reader to do next.
          </p>
          <div class="cta">
            <span class="label">See it at</span>
            <span class="url">yoursite.com</span>
            <span class="arrow">&rarr;</span>
          </div>
        </div>

        <div class="sfoot">
          <span class="note">hello@yoursite.com</span>
          <span class="tagline">Content infrastructure in motion.</span>
        </div>
      </div>
    </div>
  </body>
</html>
