<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meridian · deck · cover</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="../../../brand-kit/brand.css" />
    <link rel="stylesheet" href="deck.css" />
    <style>
      /* Cover-only overrides: bigger lockup, hero motto, no section kicker. */
      .cover .logo-lockup {
        font-size: 52px;
      }
      .motto {
        font-family: var(--sans);
        font-weight: 900;
        font-size: 124px;
        line-height: 1.05;
        letter-spacing: -0.04em;
        color: var(--fg);
      }
      .motto span {
        display: block;
      }
      .motto .accent {
        color: var(--accent);
      }
      .desc {
        margin-top: 34px;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 32px;
        line-height: 1.4;
        color: var(--muted);
        max-width: 34ch;
      }
    </style>
  </head>
  <body>
    <div class="canvas cover">
      <div class="stage">
        <div class="shead">
          <div class="logo-lockup"><span class="wordmark">Meridian</span></div>
          <div class="smeta"><span class="section">Freight operations software</span></div>
        </div>

        <div class="sbody">
          <h1 class="motto">
            <span>One timeline</span>
            <span class="accent">for every load.</span>
          </h1>
          <p class="desc">Broker, carrier and shipper looking at the same thing, from tender to proof of delivery.</p>
        </div>

        <div class="sfoot">
          <span class="note">Seed round · Confidential</span>
          <span class="tagline">One timeline for every load.</span>
        </div>
      </div>
    </div>
  </body>
</html>
